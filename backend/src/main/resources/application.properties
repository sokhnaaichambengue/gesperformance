server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/performances_territoires?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Le schéma est géré par db/schema.sql (pas de génération automatique)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT : définir JWT_SECRET en production (32 caractères minimum)
app.jwt.secret=${JWT_SECRET:CHANGER-CE-SECRET-EN-PRODUCTION-0123456789}
app.jwt.expiration-minutes=480

# CORS : adresse du frontend React
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# COMPTE DE DÉMONSTRATION créé au premier démarrage si la table utilisateurs est vide
app.demo-admin.email=admin@demo.local
app.demo-admin.password=Admin@2026
